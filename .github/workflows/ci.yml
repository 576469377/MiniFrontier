name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked development environment
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements/ci-bootstrap.txt
          uv sync --locked --extra dev --no-python-downloads
      - run: uv lock --check --no-sources --no-python-downloads
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy minifrontier scripts --ignore-missing-imports
      - run: uv run minifrontier models
      - name: CPU and two-process Gloo tests
        env:
          CUDA_VISIBLE_DEVICES: ""
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: uv run pytest -q -m 'not cuda'
      - run: uv run python -m build --no-isolation
      - run: uv run twine check --strict dist/*
      - name: Inspect the installed wheel outside the checkout
        run: |
          uv pip install --python .venv/bin/python --no-deps --force-reinstall dist/*.whl
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          cd "$RUNNER_TEMP"
          minifrontier models
          python -c 'from minifrontier.models.miniqwen4 import MiniQwen4Config; print(MiniQwen4Config.__name__)'
