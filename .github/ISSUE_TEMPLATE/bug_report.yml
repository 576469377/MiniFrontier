name: Bug report
description: Report a reproducible correctness, training, or serving problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not attach private data, credentials, or untrusted pickle files.
        For security issues, follow SECURITY.md instead of opening a public issue.
  - type: input
    id: revision
    attributes:
      label: MiniFrontier revision
      description: Commit SHA or release version.
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - MiniKimiK3
        - MiniQwen4
        - MiniDeepSeekV4
        - Shared training components / packaging
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command and smallest safe recipe or code sample.
      render: shell
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the complete error and relevant logs with secrets removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, PyTorch, GPU model/count, driver, CUDA, and precision.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and reproduced this on the stated revision.
          required: true
        - label: I used only data and artifacts I am allowed to share.
          required: true
