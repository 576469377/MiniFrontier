[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minifrontier"
version = "0.1.0"
description = "Source-aligned, capacity-scaled frontier model research"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND MIT AND LicenseRef-Kimi-K3"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "LICENSES/*"]
authors = [{name = "MiniFrontier contributors"}]
keywords = ["llm", "vlm", "moe", "training", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "einops>=0.8,<0.9",
  "numpy>=2,<3",
  "Pillow>=12,<13",
  "tokenizers>=0.23,<0.24",
  "torch>=2.13,<3",
]

[project.urls]
Repository = "https://github.com/576469377/MiniFrontier"
Documentation = "https://github.com/576469377/MiniFrontier/blob/main/docs/README.md"
Issues = "https://github.com/576469377/MiniFrontier/issues"

[project.optional-dependencies]
dev = ["build==1.6.0", "mypy>=1.11,<2", "packaging==26.3", "pytest>=8.0,<10", "pytest-cov>=5.0,<8", "ruff>=0.9,<1", "setuptools==84.0.0", "twine>=6,<7", "wheel==0.48.0"]
monitoring = ["tensorboard==2.21.0"]
data = ["pyarrow>=21,<24", "Pillow>=12,<13", "huggingface-hub>=0.34,<2", "fsspec>=2025.3", "httpx[socks]>=0.28,<1", "requests>=2.32,<3"]
training = [
    "fla-core==0.5.2",
]

[project.scripts]
minifrontier = "minifrontier.cli:main"

[tool.setuptools.packages.find]
include = ["minifrontier*"]

[tool.setuptools.package-data]
minifrontier = ["py.typed"]

[tool.setuptools.data-files]
"share/minifrontier/configs" = ["configs/models.json", "configs/miniqwen4.json", "configs/minikimik3.json", "configs/minideepseekv4.json", "configs/minifrontier1.json"]
"share/minifrontier/configs/minifrontier1" = ["configs/minifrontier1/*.json"]
"share/minifrontier/configs/strategies" = ["configs/strategies/minikimik3-v2.json", "configs/strategies/miniqwen4-v2.json", "configs/strategies/minideepseekv4-v2.json", "configs/strategies/minideepseekv4-vision-v1.json", "configs/strategies/minikimik3-plan.json", "configs/strategies/miniqwen4-plan.json", "configs/strategies/minideepseekv4-plan.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "cuda: requires a CUDA device",
  "distributed: exercises torch.distributed",
  "slow: longer-running integration test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["third_party/upstream"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
