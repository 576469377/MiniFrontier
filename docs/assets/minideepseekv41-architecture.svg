<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc">
<title id="title">MiniDeepSeek-V4.1 — CED and CSA2 architecture</title>
<desc id="desc">The 242M text configuration has twelve causal layers: six encoder layers and six decoder layers. Encoder layers three and five create compressed 2:1 global KV, reused by the following layer. Decoder layer seven creates 1:1 global KV from final encoder states; layers nine and eleven reindex this shared KV, and layers eight, ten and twelve reuse the latest selected indices. Every layer retains its own local window and has Single-Pass mHC plus top-two MoE. Engram is injected before layers two and five. Hierarchical indexing, vision and MTP are disabled in this configuration.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#547080" stroke-width="1.7"/></marker></defs>
<rect x="1" y="1" width="1118" height="1118" rx="20" fill="#f7f9fb" stroke="#dce4eb"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#173747">
<text x="40" y="49" font-size="30" font-weight="700" fill="#173747" text-anchor="start">MiniDeepSeek-V4.1</text>
<text x="40" y="79" font-size="17" font-weight="400" fill="#547080" text-anchor="start">Causal encoder–decoder · 242M text configuration</text>
<text x="1080" y="47" font-size="15" font-weight="400" fill="#173747" text-anchor="end">12 layers / hidden 512 / 64K vocab</text>
<text x="1080" y="76" font-size="14" font-weight="400" fill="#547080" text-anchor="end">From scratch · no MTP · vision disabled</text>
<rect x="40" y="115" width="450" height="70" rx="10" fill="#eaf3f8" stroke="#bccdd6"/>
<text x="265.0" y="142" font-size="18" font-weight="600" fill="#173747" text-anchor="middle">Text embedding → four residual streams</text>
<text x="265.0" y="166" font-size="14" font-weight="400" fill="#547080" text-anchor="middle">65,536 → 512 · R: [batch, sequence, 4, 512]</text>
<rect x="590" y="115" width="490" height="70" rx="10" fill="#eaf3ed" stroke="#bccdd6"/>
<text x="835.0" y="142" font-size="18" font-weight="600" fill="#173747" text-anchor="middle">Every layer</text>
<text x="835.0" y="166" font-size="14" font-weight="400" fill="#547080" text-anchor="middle">Local window + Single-Pass mHC + MoE</text>
<rect x="40" y="215" width="450" height="465" rx="10" fill="white" stroke="#bccdd6"/>
<path d="M265 185 V215" fill="none" stroke="#547080" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="60" y="250" font-size="22" font-weight="650" fill="#173747" text-anchor="start">Causal encoder · layers 1–6</text>
<rect x="60" y="276" width="410" height="60" rx="10" fill="#eaf3f8" stroke="#bccdd6"/>
<text x="265.0" y="303" font-size="18" font-weight="600" fill="#173747" text-anchor="middle">L1–2 · SWA only</text>
<text x="265.0" y="327" font-size="14" font-weight="400" fill="#547080" text-anchor="middle">128-token local window</text>
<path d="M265 336 V365" fill="none" stroke="#547080" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60" y="365" width="410" height="80" rx="10" fill="#eaf3ed" stroke="#bccdd6"/>
<text x="265.0" y="392" font-size="18" font-weight="600" fill="#173747" text-anchor="middle">L3 Full → L4 Reuse</text>
<text x="265.0" y="416" font-size="14" font-weight="400" fill="#547080" text-anchor="middle">2:1 non-overlapping global KV</text>
<path d="M265 445 V474" fill="none" stroke="#547080" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60" y="474" width="410" height="80" rx="10" fill="#eaf3ed" stroke="#bccdd6"/>
<text x="265.0" y="501" font-size="18" font-weight="600" fill="#173747" text-anchor="middle">L5 Full → L6 Reuse</text>
<text x="265.0" y="525" font-size="14" font-weight="400" fill="#547080" text-anchor="middle">New 2:1 global KV from layer 5 input</text>
<path d="M265 554 V588" fill="none" stroke="#547080" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60" y="588" width="410" height="60" rx="10" fill="white" stroke="#bccdd6"/>
<text x="265.0" y="615" font-size="18" font-weight="600" fill="#173747" text-anchor="middle">Final encoder states</text>
<text x="265.0" y="639" font-size="14" font-weight="400" fill="#547080" text-anchor="middle">Causal, per-position representation</text>
<rect x="590" y="215" width="490" height="565" rx="10" fill="white" stroke="#bccdd6"/>
<text x="610" y="250" font-size="22" font-weight="650" fill="#173747" text-anchor="start">Causal decoder · layers 7–12</text>
<rect x="610" y="276" width="450" height="60" rx="10" fill="#eaf3ed" stroke="#bccdd6"/>
<text x="835.0" y="303" font-size="18" font-weight="600" fill="#173747" text-anchor="middle">L7 · Full</text>
<text x="835.0" y="327" font-size="14" font-weight="400" fill="#547080" text-anchor="middle">1:1 KV from final encoder states</text>
<path d="M835 336 V354" fill="none" stroke="#547080" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610" y="354" width="450" height="60" rx="10" fill="#eaf3f8" stroke="#bccdd6"/>
<text x="835.0" y="381" font-size="18" font-weight="600" fill="#173747" text-anchor="middle">L8 · Reuse</text>
<text x="835.0" y="405" font-size="14" font-weight="400" fill="#547080" text-anchor="middle">Reuse L7 KV + selection</text>
<path d="M835 414 V432" fill="none" stroke="#547080" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610" y="432" width="450" height="60" rx="10" fill="#fbf0df" stroke="#bccdd6"/>
<text x="835.0" y="459" font-size="18" font-weight="600" fill="#173747" text-anchor="middle">L9 · Reindex</text>
<text x="835.0" y="483" font-size="14" font-weight="400" fill="#547080" text-anchor="middle">Reuse L7 KV; select again</text>
<path d="M835 492 V510" fill="none" stroke="#547080" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610" y="510" width="450" height="60" rx="10" fill="#eaf3f8" stroke="#bccdd6"/>
<text x="835.0" y="537" font-size="18" font-weight="600" fill="#173747" text-anchor="middle">L10 · Reuse</text>
<text x="835.0" y="561" font-size="14" font-weight="400" fill="#547080" text-anchor="middle">Reuse L7 KV + L9 selection</text>
<path d="M835 570 V588" fill="none" stroke="#547080" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610" y="588" width="450" height="60" rx="10" fill="#fbf0df" stroke="#bccdd6"/>
<text x="835.0" y="615" font-size="18" font-weight="600" fill="#173747" text-anchor="middle">L11 · Reindex</text>
<text x="835.0" y="639" font-size="14" font-weight="400" fill="#547080" text-anchor="middle">Reuse L7 KV; select again</text>
<path d="M835 648 V666" fill="none" stroke="#547080" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610" y="666" width="450" height="60" rx="10" fill="#eaf3f8" stroke="#bccdd6"/>
<text x="835.0" y="693" font-size="18" font-weight="600" fill="#173747" text-anchor="middle">L12 · Reuse</text>
<text x="835.0" y="717" font-size="14" font-weight="400" fill="#547080" text-anchor="middle">Reuse L7 KV + L11 selection</text>
<text x="610" y="760" font-size="14" font-weight="400" fill="#547080" text-anchor="start">Each decoder layer also has its own local KV</text>
<path d="M470 618 H530 V309 H610" fill="none" stroke="#547080" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="551" y="544" font-size="13" fill="#547080" transform="rotate(-90 551 544)">Residual state + KV source</text>
<path d="M835 780 V805" fill="none" stroke="#547080" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="590" y="805" width="490" height="70" rx="10" fill="white" stroke="#bccdd6"/>
<text x="835.0" y="832" font-size="18" font-weight="600" fill="#173747" text-anchor="middle">Final mix → RMSNorm → LM head</text>
<text x="835.0" y="856" font-size="14" font-weight="400" fill="#547080" text-anchor="middle">512 → 65,536 · next-token prediction</text>
<rect x="40" y="715" width="450" height="80" rx="10" fill="#fbf0df" stroke="#bccdd6"/>
<text x="265.0" y="742" font-size="18" font-weight="600" fill="#173747" text-anchor="middle">Engram before layers 2 and 5</text>
<text x="265.0" y="766" font-size="14" font-weight="400" fill="#547080" text-anchor="middle">2/3/4-gram · 2 heads per order · gated lookup</text>
<path d="M40 755 H22 V313 H60" fill="none" stroke="#547080" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<path d="M22 514 H60" fill="none" stroke="#547080" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<text x="60" y="839" font-size="17" font-weight="600" fill="#173747" text-anchor="start">All 12 layers: content-routed MoE</text>
<text x="60" y="867" font-size="14" font-weight="400" fill="#547080" text-anchor="start">32 experts choose 2 + 1 shared · FFN 256</text>
<rect x="40" y="912" width="1040" height="165" rx="10" fill="white" stroke="#bccdd6"/>
<text x="60" y="946" font-size="20" font-weight="650" fill="#173747" text-anchor="start">CSA2 shares global history across layers</text>
<text x="60" y="978" font-size="15" font-weight="400" fill="#173747" text-anchor="start">Full: create KV + index keys + selection · Reindex: update selection · Reuse: keep all three</text>
<text x="60" y="1009" font-size="14" font-weight="400" fill="#547080" text-anchor="start">4 × 32 index heads · top-16 global positions + 128-token local window · hierarchical indexing off</text>
<text x="60" y="1040" font-size="14" font-weight="400" fill="#547080" text-anchor="start">Single-Pass mHC: previous sublayer supplies pre; current sublayer predicts pre_next, post and C.</text>
<text x="40" y="1100" font-size="13" font-weight="400" fill="#547080" text-anchor="start">Configuration: configs/minideepseekv41.json · layer numbering starts at 1 · cache currently recomputes the full prefix</text>
