<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="855" viewBox="0 0 1200 855" role="img" aria-labelledby="title desc">
<title id="title">MF1 / three ways to read history</title><desc id="desc">The same 512-wide layer interface; different history representations and retrieval paths</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#172b46">
<text x="32" y="42" font-size="25" font-weight="600" text-anchor="start" fill="#172b46">MF1 / three ways to read history</text>
<text x="32" y="72" font-size="14" font-weight="400" text-anchor="start" fill="#172b46">The same 512-wide layer interface; different history representations and retrieval paths</text>
<rect x="28" y="108" width="350" height="76" rx="10" fill="#e9f1ff" stroke="#b9c9dd"/>
<text x="203.0" y="135" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">KDA</text>
<text x="203.0" y="159" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">12 layers · 8 heads × 64</text>
<rect x="425" y="108" width="350" height="76" rx="10" fill="#e9f1ff" stroke="#b9c9dd"/>
<text x="600.0" y="135" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">CSA-4</text>
<text x="600.0" y="159" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Layers 4 and 12</text>
<rect x="822" y="108" width="350" height="76" rx="10" fill="#e9f1ff" stroke="#b9c9dd"/>
<text x="997.0" y="135" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">QSA-MLA</text>
<text x="997.0" y="159" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Layers 8 and 16</text>
<rect x="28" y="223" width="350" height="96" rx="10" fill="#e9f1ff" stroke="#b9c9dd"/>
<text x="203.0" y="250" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">Current token + previous state</text>
<text x="203.0" y="274" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Q / K / V + short causal convolution</text>
<text x="203.0" y="295" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Input-dependent decay and delta update</text>
<polyline points="203,184 203,223" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="28" y="362" width="350" height="96" rx="10" fill="#e9f1ff" stroke="#b9c9dd"/>
<text x="203.0" y="389" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">Update recurrent memory</text>
<text x="203.0" y="413" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">8 state matrices, each 64 × 64</text>
<text x="203.0" y="434" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">No list of all historical raw token KV</text>
<polyline points="203,319 203,362" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="28" y="515" width="350" height="96" rx="10" fill="#e9f1ff" stroke="#b9c9dd"/>
<text x="203.0" y="542" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">Query the updated state</text>
<text x="203.0" y="566" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">History is summarized in the state</text>
<text x="203.0" y="587" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Output gate → project to width 512</text>
<polyline points="203,458 203,515" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="425" y="223" width="350" height="96" rx="10" fill="#e9f1ff" stroke="#b9c9dd"/>
<text x="600.0" y="250" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">Compress each 4-token block</text>
<text x="600.0" y="274" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Learned overlapping pooling</text>
<text x="600.0" y="295" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Boundaries respect sample and media IDs</text>
<polyline points="600,184 600,223" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="425" y="362" width="350" height="96" rx="10" fill="#e9f1ff" stroke="#b9c9dd"/>
<text x="600.0" y="389" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">Select compressed history</text>
<text x="600.0" y="413" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Dense: all visible compressed blocks</text>
<text x="600.0" y="434" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Sparse: indexer selects up to 64 blocks</text>
<polyline points="600,319 600,362" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="425" y="515" width="350" height="96" rx="10" fill="#e9f1ff" stroke="#b9c9dd"/>
<text x="600.0" y="542" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">Compressed KV + local KV</text>
<text x="600.0" y="566" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Compressed values remain compressed</text>
<text x="600.0" y="587" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Also read a 128-token raw local window</text>
<polyline points="600,458 600,515" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="822" y="223" width="350" height="96" rx="10" fill="#e9f1ff" stroke="#b9c9dd"/>
<text x="997.0" y="250" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">Latent KV + separate block index</text>
<text x="997.0" y="274" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Per-token latent 128 + RoPE 32</text>
<text x="997.0" y="295" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Indexer pools keys in 4-token blocks</text>
<polyline points="997,184 997,223" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="822" y="362" width="350" height="96" rx="10" fill="#e9f1ff" stroke="#b9c9dd"/>
<text x="997.0" y="389" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">Choose blocks, then raw members</text>
<text x="997.0" y="413" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Sparse: up to 64 completed blocks</text>
<text x="997.0" y="434" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Union with local 128 + visible media</text>
<polyline points="997,319 997,362" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="822" y="515" width="350" height="96" rx="10" fill="#e9f1ff" stroke="#b9c9dd"/>
<text x="997.0" y="542" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">Read selected raw token KV</text>
<text x="997.0" y="566" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Latent projection + gated output</text>
<text x="997.0" y="587" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Dense phase uses all causal raw tokens</text>
<polyline points="997,458 997,515" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="203,611 203,650" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="28" y="650" width="350" height="66" rx="10" fill="#e8f4ee" stroke="#b9c9dd"/>
<text x="203.0" y="677" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">Output: 512 → GR write</text>
<polyline points="600,611 600,650" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="425" y="650" width="350" height="66" rx="10" fill="#e8f4ee" stroke="#b9c9dd"/>
<text x="600.0" y="677" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">Output: 512 → GR write</text>
<polyline points="997,611 997,650" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="822" y="650" width="350" height="66" rx="10" fill="#e8f4ee" stroke="#b9c9dd"/>
<text x="997.0" y="677" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">Output: 512 → GR write</text>
<text x="28" y="765" font-size="13" font-weight="600" text-anchor="start" fill="#172b46">Cache growth: fixed-size recurrent state</text>
<text x="425" y="765" font-size="13" font-weight="600" text-anchor="start" fill="#172b46">Cache growth: compressed history</text>
<text x="822" y="765" font-size="13" font-weight="600" text-anchor="start" fill="#172b46">Cache growth: all raw latent history</text>
<text x="28" y="792" font-size="13" font-weight="400" text-anchor="start" fill="#172b46">plus a short convolution buffer.</text>
<text x="425" y="792" font-size="13" font-weight="400" text-anchor="start" fill="#172b46">plus raw window and pending block.</text>
<text x="822" y="792" font-size="13" font-weight="400" text-anchor="start" fill="#172b46">plus position and index metadata.</text>
<text x="28" y="832" font-size="14" font-weight="400" text-anchor="start" fill="#172b46">Every path obeys causal and packed-sample boundaries. Sparse selection alone does not establish an inference speedup.</text>
</g></svg>