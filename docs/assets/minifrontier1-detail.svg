<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1250" viewBox="0 0 1120 1250" role="img" aria-labelledby="title desc">
<title id="title">MiniFrontier1.0 — native multimodal architecture</title>
<desc id="desc">The 228M research configuration. Text embeddings and projected ViT features merge into one sequence and expand to four residual streams. Sixteen decoder layers use KDA, except CSA-4 at layers 4 and 12 and QSA-MLA at layers 8 and 16. A lookup update is added before layer 2. Every decoder layer reads and updates the residual streams twice: attention, then LatentMoE with 32 routed experts, top-4 selection and a shared FFN. Final GR readout and the vocabulary head predict the next token. The auxiliary MTP branch receives the final four-stream state and next-token embedding and shares the vocabulary head. The main model and vision encoder start from random initialization.</desc>
