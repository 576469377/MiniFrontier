<text x="40" y="1168" font-size="14" font-weight="400" fill="#526b7b" text-anchor="start">Solid arrows: main data flow. Dashed arrows: detail callout, lookup injection or auxiliary training branch.</text>
<text x="40" y="1196" font-size="14" font-weight="400" fill="#526b7b" text-anchor="start">Layer numbers are one-based. KDA / CSA / QSA keep distinct inference caches; MTP is not a speed claim.</text>
