<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1060" viewBox="0 0 1120 1060" role="img" aria-labelledby="title desc">
<title id="title">MF1 / inside one decoder layer</title><desc id="desc">228M configuration · B and T omitted · four residual streams, each 512 channels</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#172b46">
<text x="32" y="42" font-size="25" font-weight="600" text-anchor="start" fill="#172b46">MF1 / inside one decoder layer</text>
<text x="32" y="72" font-size="14" font-weight="400" text-anchor="start" fill="#172b46">228M configuration · B and T omitted · four residual streams, each 512 channels</text>
<rect x="365" y="100" width="390" height="74" rx="10" fill="#e9f1ff" stroke="#b9c9dd"/>
<text x="560.0" y="127" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">R: 4 × 512 residual state</text>
<text x="560.0" y="151" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">The first layer starts with four copies</text>
<rect x="365" y="211" width="390" height="95" rx="10" fill="#e9f1ff" stroke="#b9c9dd"/>
<text x="560.0" y="238" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">Attention GR: read + write gates</text>
<text x="560.0" y="262" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">RMSNorm per stream → gated mean h: 512</text>
<text x="560.0" y="283" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Independent write weights: 4 scalars</text>
<polyline points="560,174 560,211" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="365" y="341" width="390" height="74" rx="10" fill="#e9f1ff" stroke="#b9c9dd"/>
<text x="560.0" y="368" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">Token mixer: KDA / CSA / QSA-MLA</text>
<text x="560.0" y="392" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">One attention type per decoder layer</text>
<polyline points="560,306 560,341" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="365" y="450" width="390" height="74" rx="10" fill="#e9f1ff" stroke="#b9c9dd"/>
<text x="560.0" y="477" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">Write attention update</text>
<text x="560.0" y="501" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">R′[j] = R[j] + beta_attn[j] × attention(h)</text>
<polyline points="560,415 560,450" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="755,137 850,137 850,487 755,487" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="870" y="307" font-size="14" font-weight="400" text-anchor="start" fill="#172b46">Residual</text>
<text x="870" y="328" font-size="14" font-weight="400" text-anchor="start" fill="#172b46">bypass</text>
<rect x="365" y="559" width="390" height="74" rx="10" fill="#e9f1ff" stroke="#b9c9dd"/>
<text x="560.0" y="586" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">MoE GR: read + write gates</text>
<text x="560.0" y="610" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">New h: 512; separate gates from attention</text>
<polyline points="560,524 560,559" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="686" width="540" height="167" rx="10" fill="#e8f4ee" stroke="#b9c9dd"/>
<text x="318.0" y="713" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">Routed branch / LatentMoE</text>
<text x="318.0" y="737" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Router uses h: 512 → 32 scores; select top 4</text>
<text x="318.0" y="758" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Down-project h: 512 → 256</text>
<text x="318.0" y="779" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">4 selected experts: SiTU FFN 256 → 256 → 256</text>
<text x="318.0" y="800" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Weighted sum → RMSNorm → up-project 256 → 512</text>
<text x="318.0" y="821" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Correction bias selects experts; original scores mix them</text>
<rect x="662" y="686" width="410" height="167" rx="10" fill="#fff3de" stroke="#b9c9dd"/>
<text x="867.0" y="713" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">Shared branch / always active</text>
<text x="867.0" y="737" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Uses the same full-width h: 512</text>
<text x="867.0" y="758" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">SiTU FFN: 512 → 768 → 512</text>
<text x="867.0" y="779" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">Runs alongside the routed experts</text>
<text x="867.0" y="800" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">No latent down-projection in this branch</text>
<polyline points="560,633 560,658 318,658 318,686" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="560,658 867,658 867,686" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="365" y="893" width="390" height="74" rx="10" fill="#e9f1ff" stroke="#b9c9dd"/>
<text x="560.0" y="920" font-size="17" font-weight="600" text-anchor="middle" fill="#172b46">Sum both branches, then GR write</text>
<text x="560.0" y="944" font-size="14" font-weight="400" text-anchor="middle" fill="#172b46">R_out[j] = R′[j] + beta_moe[j] × MoE(h)</text>
<polyline points="318,853 318,930 365,930" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="867,853 867,930 755,930" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="365,487 22,487 22,985 560,985 560,967" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="35" y="538" font-size="14" font-weight="400" text-anchor="start" fill="#172b46">R′ bypass</text>
<text x="32" y="1030" font-size="14" font-weight="400" text-anchor="start" fill="#172b46">GR reads normalized states; its write updates the unnormalized residual state. Dimensions are feature widths.</text>
</g></svg>