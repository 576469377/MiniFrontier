<text x="1080" y="47" font-size="15" font-weight="400" fill="#173747" text-anchor="end">16 layers / hidden 512 / 32K vocab</text>
<text x="1080" y="76" font-size="14" font-weight="400" fill="#547080" text-anchor="end">Random initialization · independent from MF1.0</text>
