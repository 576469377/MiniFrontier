<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1090" viewBox="0 0 1120 1090" role="img" aria-labelledby="title desc">
<title id="title">MiniFrontier1.1 — native multimodal architecture</title>
<desc id="desc">The 211M research configuration uses twelve KDA, two CSA and two QSA-MLA layers, with LatentMoE in every layer. Text and ViT features share four residual streams. Single-Pass mHC replaces GR: the previous sublayer supplies input mixing coefficients and the current sublayer supplies the next coefficients. Existing lookup, media boundaries and incremental attention caches are retained. MTP is absent. The chart describes the repository implementation, not measured model capability.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#547080" stroke-width="1.7"/></marker></defs>
