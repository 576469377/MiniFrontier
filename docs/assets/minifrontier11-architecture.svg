<text x="212.5" y="166" font-size="14" font-weight="400" fill="#547080" text-anchor="middle">Token embedding: 32,768 → 512</text>
<rect x="425" y="115" width="655" height="76" rx="10" fill="#eaf3ed" stroke="#bccdd6"/>
<text x="752.5" y="142" font-size="18" font-weight="600" fill="#173747" text-anchor="middle">Images / sampled video frames</text>
<text x="752.5" y="166" font-size="14" font-weight="400" fill="#547080" text-anchor="middle">Conv3D (2 × 16 × 16) → ViT384 × 12 → 2 × 2 merge → 512</text>
